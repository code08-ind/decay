# The purchase webhook (P4.3): a Cloudflare Worker that Paddle calls. Deploy: `npx wrangler
# deploy` from this folder, after setting the secrets (Docs/Release.md "Selling Decay Pro"):
#   wrangler secret put PADDLE_WEBHOOK_SECRET  # the notification destination's secret key
#   wrangler secret put PADDLE_API_KEY         # a Paddle API key that can read customers
#   wrangler secret put LICENSE_SIGNING_KEY    # ~/.decay/license-signing.key (64 hex)
#   wrangler secret put RESEND_API_KEY         # Resend API key (sending only)
name = "decay-license-webhook"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[vars]
# Who the license email comes from (a domain verified in Resend).
EMAIL_FROM = "Decay <licenses.decay@aryangarg.com>"
# Paddle price ids that are Decay Pro (comma-separated); empty: any.
PADDLE_PRICE_IDS = "pri_01m878svs4bgc3z7wq69kpp85z"
# "sandbox" while testing with Paddle's sandbox; "production" for real sales.
PADDLE_ENV = "sandbox"
