[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
edition = "2024"
rust-version = "1.99"  # the pinned toolchain (rust-toolchain.toml), the only one CI tests
license = "MIT OR Apache-2.0"
repository = "https://github.com/code08-ind/decay"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"

# Title patterns run on regress: optimise it even in debug/test builds, so the ReDoS timing
# tests measure the engine, not debug overhead (they flaked on Windows CI runners).
[profile.dev.package.regress]
opt-level = 3
