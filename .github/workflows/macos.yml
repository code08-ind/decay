name: macOS

# The Rust checks on macOS (the platform code, the NSPanel, the Keychain), with the
# coverage gate. Nightly and on demand rather than on every push: hosted macOS runners
# are often unavailable, which used to block every push (see ci.yml).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # From GitHub releases (the nexte.st download host returned 504s on macOS runners).
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-nextest,cargo-llvm-cov
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo llvm-cov nextest --workspace --fail-under-lines 80
      # The "never lose work" suite with many more random sessions than on every push.
      - run: cargo nextest run -p decay-engine --test safety
        env:
          PROPTEST_CASES: "1000"
      # A failing seed, to replay it locally (proptest writes it next to the test).
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: proptest-regressions
          path: crates/decay-engine/tests/*.proptest-regressions
          if-no-files-found: ignore
