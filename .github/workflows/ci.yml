name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The Rust core must decide exactly like the extension's policy: the parity fixtures
      # and JS case tables have to be regenerated whenever lib/policy changes (with the
      # Node version in .nvmrc, which setup-node uses).
      - name: Policy parity fixtures are up to date
        run: |
          pnpm --filter @decay/extension parity
          git diff --exit-code -- crates/decay-core/tests/fixtures crates/decay-core/src/js_case.rs
      # The app must read exactly what the extension sends (chunks, the import archive).
      - name: Bridge fixtures are up to date
        run: |
          pnpm --filter @decay/extension bridge-fixtures
          git diff --exit-code -- crates/decay-bridge/tests/fixtures crates/decay-store/tests/fixtures

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml (the pinned version and its components).
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # From GitHub releases (the nexte.st download host returned 504s on macOS runners).
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-nextest
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo nextest run --workspace
