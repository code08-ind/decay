name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Every package declares the license LICENSE.md gives its folder (P4.5).
      - run: node tools/check-licenses.mjs
      - run: pnpm typecheck
      - run: pnpm test
      # Line coverage ≥ 80 % (thresholds in apps/extension/vitest.config.ts).
      - run: pnpm --filter @decay/extension coverage
      - run: pnpm build
      # The extension's Firefox build (F14): same source, MV3 with Firefox's manifest.
      - run: pnpm --filter @decay/extension build:firefox
      # The Rust core must decide exactly like the extension's policy: the parity fixtures
      # and JS case tables have to be regenerated whenever lib/policy changes (with the
      # Node version in .nvmrc, which setup-node uses).
      - name: Policy parity fixtures are up to date
        run: |
          pnpm --filter @decay/extension parity
          git diff --exit-code -- crates/decay-core/tests/fixtures crates/decay-core/src/js_case.rs
      # The app must read exactly what the extension sends (chunks, the import archive, the
      # adapter's acks).
      - name: Bridge fixtures are up to date
        run: |
          pnpm --filter @decay/extension bridge-fixtures
          git diff --exit-code -- crates/decay-bridge/tests/fixtures crates/decay-store/tests/fixtures crates/decay-engine/tests/fixtures
          test -z "$(git status --porcelain -- crates/decay-engine/tests/fixtures)"

  # Every push and PR: Rust on Windows, with the coverage gate (CI fails below 80 % of
  # lines). macOS runs nightly and on demand (macos.yml): hosted macOS runners were often
  # unavailable ("not acquired by Runner … even after multiple attempts"), which blocked
  # every push.
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml (the pinned version and its components).
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-nextest,cargo-llvm-cov
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Every failure in one run (a Windows round trip takes ~15 min).
      - run: cargo llvm-cov nextest --workspace --no-fail-fast --fail-under-lines 80
