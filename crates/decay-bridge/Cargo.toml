[package]
name = "decay-bridge"
version = "0.1.0"
description = "Decay's extension ⇄ host ⇄ app protocol: message types, framing, chunking and local IPC"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
decay-core = { path = "../decay-core" }
interprocess = "2.4.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
thiserror = "2.0.21"
uuid = { version = "1.29.1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["process"] }

[target.'cfg(windows)'.dependencies]
widestring = "1.2.1"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
