[package]
name = "decay-platform"
version = "0.1.0"
description = "Decay's OS layer: idle time, sleep / lock, the frontmost app, audio and the Accessibility permission"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"

# The workspace forbids `unsafe`; this crate needs it for the OS calls (macOS frameworks),
# so it denies it instead and allows it only in `mac.rs`, one commented call at a time.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
undocumented_unsafe_blocks = "warn"
