[package]
name = "decay-platform"
version = "0.1.0"
description = "Decay's OS layer: idle time, sleep / lock, the frontmost app, audio, app windows and the Accessibility permission"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"

# P3.1: Win32 calls (idle, session lock, display power, the window in front, audio
# sessions, app windows); P3.5: microphone / camera use (the registry). Same version Tauri already pulls in.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

# The workspace forbids `unsafe`; this crate needs it for the OS calls (macOS frameworks,
# Win32), so it denies it instead and allows it only in the OS files (`mac*.rs`,
# `win*.rs` minus `win_logic.rs`), one commented call at a time.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
undocumented_unsafe_blocks = "warn"
