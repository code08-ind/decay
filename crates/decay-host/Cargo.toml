[package]
name = "decay-host"
version = "0.1.0"
description = "Decay's native messaging host: relays the browser extension to the app, and installs the host manifests"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
decay-bridge = { path = "../decay-bridge" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
