[package]
name = "decay-license"
version = "0.1.0"
description = "Decay Pro licenses: offline Ed25519 key verification, the 14-day trial and the tier"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
# Pro licensing is proprietary (Software Design §3, open-core split).
license = "LicenseRef-Proprietary"
