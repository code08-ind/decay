[package]
name = "decay-store"
version = "0.1.0"
description = "Decay storage: encrypted SQLite (SQLCipher), migrations, full-text search, backups"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
decay-core = { path = "../decay-core" }
getrandom = "0.4.3"
jiff = "0.2.43"
rusqlite = { version = "0.41.1", features = ["bundled-sqlcipher-vendored-openssl", "backup", "functions", "fallible_uint"] }
serde = "1.0.229"
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = { version = "1.29.1", features = ["v7"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
