[package]
name = "decay-app"
version = "0.1.2"
description = "Decay desktop app: the Tauri shell around the engine (tray, hotkey, deep links, windows)"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
# Source-available (FSL), like the rest of the desktop app: LICENSE.md.
license = "FSL-1.1-ALv2"
publish = false
default-run = "decay"

[lib]
name = "decay_app"
path = "src/lib.rs"

[[bin]]
name = "decay"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
decay-bridge = { path = "../../../crates/decay-bridge" }
decay-core = { path = "../../../crates/decay-core" }
decay-engine = { path = "../../../crates/decay-engine" }
decay-host = { path = "../../../crates/decay-host" }
decay-license = { version = "0.1.0", path = "../../../crates/decay-license" }
decay-platform = { path = "../../../crates/decay-platform" }
decay-store = { path = "../../../crates/decay-store" }
jiff = "0.2.43"
keyring = "4.2.0"
sentry = { version = "0.49.5", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
sentry-tracing = "0.49.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-deep-link = "2.6.3"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-notification = "2.8.1"
tauri-plugin-single-instance = { version = "2.5.5", features = ["deep-link"] }
tauri-plugin-updater = "2.14.1"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "registry"] }
url = "2.5.8"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The search panel as a non-activating NSPanel (Software Design §4.9).
tauri-nspanel = "2.1.1"

[target.'cfg(windows)'.dependencies]
# Opening the extension's store page in a given browser (its App Paths entry).
winreg = "0.56.0"

[target.'cfg(unix)'.dependencies]
# Tauri's async runtime; `signal` for a clean stop on SIGTERM / SIGINT.
tokio = { version = "1.54.1", features = ["signal", "macros"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
