<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>02-tray-windows-light</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['Newsreader', 'Georgia', 'serif'],
            sans: ['"DM Sans"', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          },
          colors: {
            sage: {
              desktop: '#7FA77A',
              subtle: '#6E9869'
            },
            ivory: {
              surface: '#FFFDF6',
              border: '#E8E4CF',
              card: '#F6F3E3',
              subtle: '#EDE9D4'
            },
            forest: {
              DEFAULT: '#4F8A4B',
              dark: '#3E6F3A',
              light: '#629E5E'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }
    .mica-effect {
      background: rgba(255, 253, 246, 0.94);
      backdrop-filter: blur(24px) saturate(140%);
      -webkit-backdrop-filter: blur(24px) saturate(140%);
    }
    .mica-menu {
      background: rgba(255, 253, 246, 0.97);
      backdrop-filter: blur(20px) saturate(150%);
      -webkit-backdrop-filter: blur(20px) saturate(150%);
    }
    .taskbar-mica {
      background: rgba(247, 245, 234, 0.94);
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
    }
  </style>
</head>
<body class="w-screen h-screen bg-[#7FA77A] relative flex flex-col justify-end text-[#1A2016]">

  <!-- Subtle Wallpaper Mesh / Dot texture characteristic of Decay -->
  <div class="absolute inset-0 pointer-events-none opacity-20"
       style="background-image: radial-gradient(rgba(255, 255, 255, 0.4) 1px, transparent 1px); background-size: 24px 24px;">
  </div>

  <!-- FLOATING ARTIFACTS CONTAINER (Bottom-anchored above taskbar) -->
  <div class="relative w-full flex-1 flex items-end justify-end pb-4 pr-6 gap-5 z-20">

    <!-- 1. WINDOWS 11 RIGHT-CLICK CONTEXT MENU (To the left of popover) -->
    <div class="mica-menu w-[220px] rounded-lg border border-[#E2DEC8] shadow-2xl p-1.5 flex flex-col gap-0.5 mb-2 animate-in fade-in slide-in-from-bottom-2 duration-200">
      
      <!-- Menu Item: Open Decay -->
      <button class="w-full flex items-center justify-between px-2.5 py-1.5 rounded-md hover:bg-[#EBE7D3] active:bg-[#E2DEC8] text-xs font-medium text-[#1E2519] transition-colors group">
        <div class="flex items-center gap-2.5">
          <svg class="w-4 h-4 text-[#4F8A4B]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2C6.5 2 2 6.5 2 12c0 5 3.5 9 8.5 9.8.5.1 1.5.2 1.5-1v-4c0-.6.4-1 1-1h1c4 0 7-3 7-7 0-4.5-4-8.8-9-8.8z"/>
            <path d="M12 2c0 5 3 9 8 9"/>
          </svg>
          <span class="font-semibold text-[#182014]">Open Decay</span>
        </div>
        <span class="text-[10px] text-[#7E8873] font-mono">Ctrl+L</span>
      </button>

      <!-- Menu Item: Search archive -->
      <button class="w-full flex items-center justify-between px-2.5 py-1.5 rounded-md hover:bg-[#EBE7D3] active:bg-[#E2DEC8] text-xs font-medium text-[#2E3628] transition-colors">
        <div class="flex items-center gap-2.5">
          <svg class="w-3.5 h-3.5 text-[#5F6A54]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <span>Search archive</span>
        </div>
        <span class="text-[10px] text-[#7E8873] font-mono">Ctrl+Alt+D</span>
      </button>

      <!-- Menu Item: Sweep now -->
      <button class="w-full flex items-center justify-between px-2.5 py-1.5 rounded-md hover:bg-[#EBE7D3] active:bg-[#E2DEC8] text-xs font-medium text-[#2E3628] transition-colors">
        <div class="flex items-center gap-2.5">
          <svg class="w-3.5 h-3.5 text-[#4F8A4B]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path>
          </svg>
          <span>Sweep now</span>
        </div>
        <span class="text-[10px] text-[#7E8873] font-mono">Ctrl+↵</span>
      </button>

      <!-- Menu Item: Pause for 1 hour -->
      <button class="w-full flex items-center justify-between px-2.5 py-1.5 rounded-md hover:bg-[#EBE7D3] active:bg-[#E2DEC8] text-xs font-medium text-[#2E3628] transition-colors">
        <div class="flex items-center gap-2.5">
          <svg class="w-3.5 h-3.5 text-[#5F6A54]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="10" y1="15" x2="10" y2="9"></line>
            <line x1="14" y1="15" x2="14" y2="9"></line>
          </svg>
          <span>Pause for 1 hour</span>
        </div>
      </button>

      <div class="h-[1px] bg-[#E5E0CB] my-1 mx-1.5"></div>

      <!-- Menu Item: Settings -->
      <button class="w-full flex items-center justify-between px-2.5 py-1.5 rounded-md hover:bg-[#EBE7D3] active:bg-[#E2DEC8] text-xs font-medium text-[#2E3628] transition-colors">
        <div class="flex items-center gap-2.5">
          <svg class="w-3.5 h-3.5 text-[#5F6A54]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
          <span>Settings</span>
        </div>
      </button>

      <!-- Menu Item: Quit Decay -->
      <button class="w-full flex items-center justify-between px-2.5 py-1.5 rounded-md hover:bg-[#FBE8E6] active:bg-[#F6D5D2] text-xs font-medium text-[#B83A3A] transition-colors">
        <div class="flex items-center gap-2.5">
          <svg class="w-3.5 h-3.5 text-[#B83A3A]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
            <line x1="12" y1="2" x2="12" y2="12"></line>
          </svg>
          <span>Quit Decay</span>
        </div>
      </button>

    </div>

    <!-- 2. MAIN TRAY POPOVER (360x500, 8px corners, Mica ivory styling) -->
    <!-- Positioned directly above highlighted taskbar icon -->
    <div class="relative w-[360px] h-[500px] mica-effect rounded-lg border border-[#E2DEC8] shadow-[0_12px_36px_rgba(20,32,15,0.18),0_2px_8px_rgba(20,32,15,0.06)] flex flex-col justify-between p-4 mb-2 z-30">
      
      <!-- Top Section -->
      <div class="flex flex-col gap-3">
        
        <!-- Header: Leaf + Serif "Decay" + Pill "● Automatic" + Gear Button -->
        <div class="flex items-center justify-between pb-0.5">
          <div class="flex items-center gap-2">
            <div class="w-6 h-6 rounded-md bg-[#4F8A4B]/12 flex items-center justify-center text-[#4F8A4B]">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2C6.5 2 2 6.5 2 12c0 5 3.5 9 8.5 9.8.5.1 1.5.2 1.5-1v-4c0-.6.4-1 1-1h1c4 0 7-3 7-7 0-4.5-4-8.8-9-8.8z"/>
                <path d="M12 2c0 5 3 9 8 9"/>
              </svg>
            </div>
            <span class="font-serif text-lg font-medium tracking-tight text-[#161E13]">Decay</span>
            <span class="text-[11px] text-[#86927C] font-mono pt-0.5">v1.4</span>
          </div>

          <div class="flex items-center gap-1.5">
            <!-- Mode Pill: Automatic -->
            <div class="flex items-center gap-1.5 bg-[#EAE6D3] border border-[#DDD8C2] rounded-full px-2.5 py-1 text-[11px] font-medium text-[#2A3423]">
              <span class="w-1.5 h-1.5 rounded-full bg-[#4F8A4B]"></span>
              <span>Automatic</span>
            </div>
            <!-- Settings icon button -->
            <button class="w-7 h-7 rounded-md hover:bg-[#EBE7D3] active:bg-[#E0DCB5] flex items-center justify-center text-[#55614C] transition-colors">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
              </svg>
            </button>
          </div>
        </div>

        <!-- Search Pill: Search archive + shortcut "Ctrl+Alt+D" -->
        <div class="w-full bg-[#F5F2E0] hover:bg-[#EFEBD6] border border-[#E3DFC8] rounded-md px-3 py-1.5 flex items-center justify-between cursor-pointer transition-colors group">
          <div class="flex items-center gap-2 text-xs text-[#6F7A64] group-hover:text-[#424C38]">
            <svg class="w-3.5 h-3.5 text-[#7E8873]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <span>Search archive</span>
          </div>
          <span class="text-[10px] font-mono font-medium text-[#848F78] bg-[#E9E5CF] px-1.5 py-0.5 rounded border border-[#DBD6BF]">Ctrl+Alt+D</span>
        </div>

        <!-- Two Stat Tiles: "41 open tabs" and "7 getting stale" -->
        <div class="grid grid-cols-2 gap-2.5">
          <!-- Stat 1: Open tabs -->
          <div class="bg-[#F6F3E3] border border-[#E5E1CB] rounded-lg p-2.5 flex flex-col justify-between">
            <div class="flex items-center justify-between text-[11px] text-[#69755F]">
              <span>Open tabs</span>
              <svg class="w-3.5 h-3.5 text-[#86927C]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="9" y1="3" x2="9" y2="21"></line>
              </svg>
            </div>
            <div class="flex items-baseline gap-2 mt-1">
              <span class="font-serif text-2xl font-normal text-[#161F12] leading-none">41</span>
              <span class="text-[11px] text-[#4F8A4B] font-medium flex items-center">
                ↓ 38%
              </span>
            </div>
          </div>

          <!-- Stat 2: Getting stale -->
          <div class="bg-[#F6F3E3] border border-[#E5E1CB] rounded-lg p-2.5 flex flex-col justify-between">
            <div class="flex items-center justify-between text-[11px] text-[#69755F]">
              <span>Getting stale</span>
              <svg class="w-3.5 h-3.5 text-[#86927C]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 22h14"></path>
                <path d="M5 2h14"></path>
                <path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22"></path>
                <path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2"></path>
              </svg>
            </div>
            <div class="flex items-baseline gap-2 mt-1">
              <span class="font-serif text-2xl font-normal text-[#161F12] leading-none">7</span>
              <span class="text-[11px] text-[#69755F] font-normal">
                in 18m
              </span>
            </div>
          </div>
        </div>

        <!-- Deep Green Card: LAST SWEEP · 2:14 PM -->
        <div class="bg-[#4F8A4B] text-white rounded-lg p-3 shadow-sm flex flex-col gap-2 relative overflow-hidden">
          <!-- Top badge and status dot -->
          <div class="flex items-center justify-between text-[10px] font-semibold tracking-wider uppercase text-[#D2E7CF]">
            <span>Last sweep · 2:14 PM</span>
            <span class="w-1.5 h-1.5 rounded-full bg-[#B2E4AE]"></span>
          </div>

          <!-- Headline & helper text -->
          <div>
            <h4 class="font-serif text-lg font-normal tracking-tight text-white leading-tight">Archived 14 tabs</h4>
            <p class="text-[11px] text-[#D4E8D1] font-normal mt-0.5">11 tabs · 3 windows · all restorable</p>
          </div>

          <!-- Buttons: White pill "Undo" + Outline "View" -->
          <div class="flex items-center gap-2 mt-1">
            <button class="bg-white hover:bg-[#F5F8F3] text-[#2F612B] text-xs font-semibold px-3 py-1 rounded-full shadow-sm flex items-center gap-1.5 transition-colors">
              <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 7v6h6"></path>
                <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path>
              </svg>
              <span>Undo</span>
            </button>
            <button class="bg-[#437A3F] hover:bg-[#3B6D37] border border-[#659F61] text-white text-xs font-medium px-3.5 py-1 rounded-full transition-colors">
              View
            </button>
          </div>
        </div>

        <!-- Pause Sweeps Pills: 1 hour / Until tomorrow / Meeting mode -->
        <div class="flex flex-col gap-1.5 pt-0.5">
          <span class="text-[11px] font-medium text-[#737F69]">Pause sweeps</span>
          <div class="grid grid-cols-3 gap-1.5">
            <button class="bg-[#F5F2E0] hover:bg-[#EAE6D1] active:bg-[#E0DCC5] border border-[#E3DFC8] text-[#2A3323] text-[11px] font-medium py-1 px-1.5 rounded-md text-center transition-colors">
              1 hour
            </button>
            <button class="bg-[#F5F2E0] hover:bg-[#EAE6D1] active:bg-[#E0DCC5] border border-[#E3DFC8] text-[#2A3323] text-[11px] font-medium py-1 px-1.5 rounded-md text-center transition-colors truncate">
              Until tomorrow
            </button>
            <button class="bg-[#F5F2E0] hover:bg-[#EAE6D1] active:bg-[#E0DCC5] border border-[#E3DFC8] text-[#2A3323] text-[11px] font-medium py-1 px-1.5 rounded-md text-center transition-colors truncate">
              Meeting mode
            </button>
          </div>
        </div>

      </div>

      <!-- Bottom Actions & Footer Links -->
      <div class="flex flex-col gap-2 pt-2 border-t border-[#E8E4CE]">
        <!-- Black pill: "Open Decay" + Ctrl+L -->
        <button class="w-full bg-[#182015] hover:bg-[#252F21] active:bg-[#0D120B] text-[#FFFDF6] text-xs font-medium py-2 px-3.5 rounded-md flex items-center justify-between transition-colors shadow-sm">
          <div class="flex items-center gap-2">
            <svg class="w-3.5 h-3.5 text-[#A2C79D]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
              <polyline points="15 3 21 3 21 9"></polyline>
              <line x1="10" y1="14" x2="21" y2="3"></line>
            </svg>
            <span class="font-semibold tracking-tight">Open Decay</span>
          </div>
          <span class="text-[10px] font-mono text-[#8C9885] bg-[#293424] px-1.5 py-0.5 rounded">Ctrl+L</span>
        </button>

        <!-- Small links: Shadow review · Settings · Quit -->
        <div class="flex items-center justify-center gap-3 text-[11px] text-[#717E67] font-medium">
          <a href="#" class="hover:text-[#283222] transition-colors">Shadow review</a>
          <span class="text-[#CBC5AD]">•</span>
          <a href="#" class="hover:text-[#283222] transition-colors">Settings</a>
          <span class="text-[#CBC5AD]">•</span>
          <a href="#" class="hover:text-[#B83A3A] transition-colors">Quit</a>
        </div>
      </div>

    </div>

  </div>

  <!-- 3. WINDOWS 11 LIGHT TASKBAR (Docked full width at bottom, h-12) -->
  <div class="relative w-full h-12 taskbar-mica border-t border-[#E3DFC8] flex items-center justify-between px-4 z-40 select-none">
    
    <!-- Left Section: Windows Weather Widget -->
    <div class="flex items-center gap-2 px-2 py-1 rounded hover:bg-black/5 cursor-pointer text-[#2D3627] text-xs">
      <svg class="w-4 h-4 text-[#D9822B]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
      <div class="flex flex-col leading-tight">
        <span class="text-[11px] font-semibold text-[#1F271A]">68°F</span>
        <span class="text-[9px] text-[#717E67]">Mostly sunny</span>
      </div>
    </div>

    <!-- Center Section: Centered Windows 11 App Icons -->
    <div class="absolute left-1/2 -translate-x-1/2 flex items-center gap-1">
      
      <!-- Start Button (Windows logo) -->
      <button class="w-10 h-10 rounded flex items-center justify-center hover:bg-black/5 active:scale-95 transition-all text-[#0078D4]">
        <svg class="w-4.5 h-4.5" viewBox="0 0 24 24" fill="currentColor">
          <path d="M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm10 0h8v8h-8v-8z"/>
        </svg>
      </button>

      <!-- Windows Search -->
      <button class="w-10 h-10 rounded flex items-center justify-center hover:bg-black/5 active:scale-95 transition-all text-[#3D4736]">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>

      <!-- Task View (Desktops) -->
      <button class="w-10 h-10 rounded flex items-center justify-center hover:bg-black/5 active:scale-95 transition-all text-[#3D4736]">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"></rect>
          <line x1="9" y1="3" x2="9" y2="21"></line>
        </svg>
      </button>

      <!-- Widgets / Copilot -->
      <button class="w-10 h-10 rounded flex items-center justify-center hover:bg-black/5 active:scale-95 transition-all text-[#3D4736]">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
      </button>

      <!-- File Explorer -->
      <button class="w-10 h-10 rounded flex items-center justify-center hover:bg-black/5 active:scale-95 transition-all text-[#D9A32B]">
        <svg class="w-4.5 h-4.5" viewBox="0 0 24 24" fill="currentColor">
          <path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/>
        </svg>
      </button>

      <!-- Microsoft Edge -->
      <button class="w-10 h-10 rounded flex items-center justify-center hover:bg-black/5 active:scale-95 transition-all text-[#0078D4]">
        <svg class="w-4.5 h-4.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="2" y1="12" x2="22" y2="12"></line>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
        </svg>
      </button>

      <!-- Decay App pinned/active on taskbar -->
      <button class="relative w-10 h-10 rounded flex items-center justify-center bg-black/5 text-[#4F8A4B]">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2C6.5 2 2 6.5 2 12c0 5 3.5 9 8.5 9.8.5.1 1.5.2 1.5-1v-4c0-.6.4-1 1-1h1c4 0 7-3 7-7 0-4.5-4-8.8-9-8.8z"/>
          <path d="M12 2c0 5 3 9 8 9"/>
        </svg>
        <!-- Windows active indicator line -->
        <span class="absolute bottom-1 w-1.5 h-0.5 bg-[#4F8A4B] rounded-full"></span>
      </button>

    </div>

    <!-- Right Section: System Tray & Clock -->
    <div class="flex items-center gap-1">
      
      <!-- Tray overflow caret "^" -->
      <button class="w-7 h-8 rounded hover:bg-black/5 flex items-center justify-center text-[#4A5543] transition-colors">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
      </button>

      <!-- HIGHLIGHTED DECAY TRAY ICON (Anchor point for the popover) -->
      <!-- Highlighted with active tint and small "7" badge -->
      <button class="relative h-8 px-2 rounded-md bg-[#DFDAC1] border border-[#CDC7AD] flex items-center justify-center gap-1 text-[#3B7238] shadow-inner transition-colors">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2C6.5 2 2 6.5 2 12c0 5 3.5 9 8.5 9.8.5.1 1.5.2 1.5-1v-4c0-.6.4-1 1-1h1c4 0 7-3 7-7 0-4.5-4-8.8-9-8.8z"/>
          <path d="M12 2c0 5 3 9 8 9"/>
        </svg>
        <!-- Stale tab count badge "7" -->
        <span class="text-[10px] font-bold text-[#2A5727] font-mono leading-none">7</span>
      </button>

      <!-- Network / Volume pill group -->
      <div class="h-8 px-2 rounded hover:bg-black/5 flex items-center gap-1.5 text-[#4A5543] cursor-pointer transition-colors">
        <!-- Wi-Fi -->
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
          <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
        <!-- Volume -->
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
      </div>

      <!-- Clock & Date: "2:21 PM" and "11/4/2026" -->
      <div class="h-8 px-2 rounded hover:bg-black/5 flex flex-col justify-center items-end text-right leading-none cursor-pointer text-[#2D3627] transition-colors">
        <span class="text-[11px] font-medium text-[#1A2215]">2:21 PM</span>
        <span class="text-[10px] text-[#63705B] mt-0.5">11/4/2026</span>
      </div>

      <!-- Notification bell / count -->
      <button class="w-7 h-8 rounded hover:bg-black/5 flex items-center justify-center text-[#4A5543] transition-colors">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
      </button>

      <!-- Desktop peek button -->
      <div class="w-1 h-5 border-l border-[#D5D0B8] ml-1"></div>

    </div>

  </div>

</body>
</html>
