<!doctype html><meta charset="utf-8"><title>Decay demo</title>
<style>
@font-face{font-family:Newsreader;src:url(assets/newsreader-latin-400-normal-BFBkh4jY.woff2)}
@font-face{font-family:'DM Sans';src:url(assets/dm-sans-latin-400-normal-CW0RaeGs.woff2)}
@font-face{font-family:'DM Sans';font-weight:500;src:url(assets/dm-sans-latin-500-normal-B9HHJjqV.woff2)}
*{box-sizing:border-box;margin:0}body{width:1280px;height:800px;overflow:hidden;font-family:'DM Sans',sans-serif;background:#f7f3e8;color:#1d211b}
.chrome{background:#dfe3d6;padding:10px 12px 0;height:52px;display:flex;gap:4px;align-items:flex-end}
.tab{flex:0 1 190px;min-width:0;height:38px;border-radius:10px 10px 0 0;background:#eef0e8;padding:0 12px;display:flex;align-items:center;gap:8px;font-size:13px;transition:all .45s ease;white-space:nowrap;overflow:hidden}
.tab span.t{overflow:hidden;text-overflow:ellipsis}.tab i{flex:none;width:18px;height:18px;border-radius:5px;background:#cfe0c3;color:#2f5a2c;font:500 11px/18px 'DM Sans';text-align:center;font-style:normal}
.tab.new{background:#ddeb9d}.tab.gone{opacity:0;flex-basis:0;padding:0}
.bar{height:12px;background:#fffdf7}
main{display:grid;grid-template-columns:380px 1fr;gap:40px;padding:24px 48px;height:648px}
.cap{display:flex;flex-direction:column;justify-content:center;gap:18px}
.step{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#4f8a4b}
h1{font-family:Newsreader,serif;font-weight:400;font-size:44px;line-height:1.08;letter-spacing:-.01em}
p{font-size:18px;line-height:1.5;color:#5f6559}.note{font-size:14px;color:#8a8f82}
.frame{justify-self:center;align-self:center;border-radius:18px;overflow:hidden;box-shadow:0 20px 50px rgba(40,50,30,.18),0 0 0 1px rgba(40,50,30,.08);background:#fffdf7;transition:all .4s}
iframe{border:0;display:block;width:100%;height:100%}
</style>
<div class="chrome" id="tabs"></div><div class="bar"></div>
<main><div class="cap"><div class="step" id="step"></div><h1 id="title"></h1><p id="body"></p><p class="note" id="note"></p></div>
<div class="frame" id="frame" style="width:400px;height:600px"><iframe id="view"></iframe></div></main>
<script src="stage.js"></script>
